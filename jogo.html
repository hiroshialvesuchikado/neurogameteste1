<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NeuroGame</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="game">

        <h1>
            NeuroGame
        </h1>


        <!-- AÇÕES DA PARTIDA -->

        <div
            id="acoesPartida"
            class="acoes-partida"
        >

            <button
                id="reiniciarPartida"
                type="button"
                class="botao-acao"
            >
                🔄 Reiniciar partida
            </button>


            <button
                id="voltarMenu"
                type="button"
                class="botao-acao"
            >
                ← Voltar ao menu
            </button>

        </div>


        <!-- PERGUNTA -->

        <h2 id="pergunta">
            Preparando jogo...
        </h2>


        <!-- PAINEL -->

        <div class="painel">

            <span>
                Pontos:
                <strong id="pontos">
                    0
                </strong>
            </span>


            <span>
                Questão:

                <strong id="numeroQuestao">
                    1
                </strong>

                /

                <strong id="totalQuestoes">
                    0
                </strong>
            </span>


            <span>
                Erros:

                <strong id="erros">
                    0
                </strong>
            </span>

        </div>


        <!-- FEEDBACK -->

        <p id="feedback"></p>


        <!-- ÁREA DE RESPOSTA DIGITADA -->

        <div
            id="areaDigitar"
            class="area-digitar"
        >

            <input
                id="respostaDigitada"
                type="text"
                placeholder="Digite o nome da estrutura"
                autocomplete="off"
            >

            <button
                id="confirmarResposta"
                type="button"
            >
                Responder
            </button>

        </div>


        <!-- INFORMAÇÃO DA ESTRUTURA -->

        <div
            id="infoEstrutura"
            class="info-estrutura"
        >
        </div>


        <!-- IMAGEM + HOTSPOTS -->

        <div class="cerebro">

            <img
                id="imagemAnatomica"
                alt="Imagem anatômica"
            >

            <svg
                id="camadaHotspots"
                class="hotspots"
            >
            </svg>

        </div>


        <!-- ANALYTICS / DEBUG -->

        <div
            id="painelAnalytics"
            class="painel-analytics"
        >

            <h3>
                📊 Analytics — Debug
            </h3>

            <div id="listaAnalytics">

                <p id="mensagemAnalytics">
                    Nenhum registro ainda.
                </p>

            </div>

        </div>

    </main>


    <!-- ANALYTICS -->

    <script src="js/analytics.js"></script>


    <!-- MAPAS -->

    <script src="Mapas/mapaPalcoTelencefalo.js"></script>

    <script src="Mapas/mapaPalcoTelencefaloMedial.js"></script>

    <script src="Mapas/mapaCadaverSulcosTelencefaloLateral.js"></script>


    <!-- CATÁLOGO -->

    <script src="Mapas/catalogoMapas.js"></script>


    <!-- MODOS DE JOGO -->

    <script src="js/modoClicar.js"></script>

    <script src="js/modoDigitar.js"></script>


    <!-- MOTOR PRINCIPAL -->

    <script src="js/game.js"></script>

</body>

</html>
